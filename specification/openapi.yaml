openapi: 3.1.0
info:
  title: RBBB command API
  version: 0.1.0-draft
  description: >-
    Experimental language-neutral HTTP command contract for RFC 0001. No
    hosted service exists and production service guarantees are not yet stable.
  license:
    name: MIT
    identifier: MIT
security:
  - bearerAuth: []
servers:
  - url: https://api.rbbb.example
    description: Placeholder used by the draft contract; no hosted service exists.
paths:
  /v1/commands:
    post:
      operationId: submitCommand
      summary: Submit an idempotent state-changing command
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./commands/command.schema.json
      responses:
        "200":
          description: Command accepted and committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
        "409":
          description: Aggregate version or command-id conflict
          content:
            application/json:
              schema:
                $ref: ./rejections/rejection.schema.json
        "422":
          description: Command rejected by a stable engine rule
          content:
            application/json:
              schema:
                $ref: ./rejections/rejection.schema.json
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    CommandResult:
      type: object
      additionalProperties: false
      required: [command_id, status, aggregate_version, public_events]
      properties:
        command_id:
          type: string
        status:
          type: string
          enum: [committed]
        aggregate_version:
          type: integer
          minimum: 1
        public_events:
          type: array
          items:
            $ref: ./events/public-event.schema.json
