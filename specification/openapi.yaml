openapi: 3.1.0
info:
  title: RBBB command API
  version: 0.2.0-draft
  description: >-
    Experimental 0.2.0-draft language-neutral HTTP command contract for RFC 0001
    timed online proxy bidding with RFC 0005 fixed bid ladder execution. No
    hosted service exists and production service guarantees are not yet stable.
  license:
    name: MIT
    identifier: MIT
security:
  - bearerAuth: []
servers:
  - url: https://api.rbbb.example
    description: Placeholder used by the draft contract; no hosted service exists.
paths:
  /v1/commands:
    post:
      operationId: submitCommand
      summary: Submit an idempotent state-changing command
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./commands/command.schema.json
      responses:
        "200":
          description: Command accepted and committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Aggregate version or bid-id conflict (stale_aggregate_version or bid_id_already_exists)
          content:
            application/json:
              schema:
                $ref: ./rejections/rejection.schema.json
        "422":
          description: Command rejected by a stable engine rule
          content:
            application/json:
              schema:
                $ref: ./rejections/rejection.schema.json
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    BadRequest:
      description: Malformed request body or command envelope validation failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid bearer authentication credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated caller is not authorized for the requested command or bidding unit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [status, error]
      properties:
        status:
          type: string
          enum: [error]
        error:
          type: string
          minLength: 1
          maxLength: 255
        message:
          type: string
          minLength: 1
          maxLength: 2000
    CommandResult:
      type: object
      additionalProperties: false
      required: [command_id, status, aggregate_version, public_events, bidder_notice]
      properties:
        command_id:
          type: string
        status:
          type: string
          enum: [committed]
        aggregate_version:
          $ref: ./common/integer.schema.json#/$defs/positiveInteger
        bidder_notice:
          $ref: "./events/maximum-notice.schema.json"
        public_events:
          type: array
          items:
            $ref: ./events/public-event.schema.json
