  - {command_id: command-5, type: place_bid, bid_id: bid-y-2, bidder_id: bidder-y, maximum_minor_units: 35000, effective_at: "2026-09-01T12:14:00Z"}
  - {command_id: command-6, type: reduce_maximum, bidder_id: bidder-y, maximum_minor_units: 20600, effective_at: "2026-09-01T12:15:00Z"}
  - {command_id: command-7, type: place_bid, bid_id: bid-y-3, bidder_id: bidder-y, maximum_minor_units: 20700, effective_at: "2026-09-01T12:16:00Z"}
