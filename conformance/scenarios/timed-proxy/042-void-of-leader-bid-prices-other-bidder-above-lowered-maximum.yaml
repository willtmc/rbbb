rfcs: ["0001", "0005"]
configuration: {fixture: usd-standard}
starting_state: {events: []}
commands:
  - {command_id: command-1, type: place_bid, bid_id: bid-x-1, bidder_id: bidder-x, maximum_minor_units: 20000, effective_at: "2026-09-01T12:10:00Z"}
  - {command_id: command-2, type: place_bid, bid_id: bid-y-1, bidder_id: bidder-y, maximum_minor_units: 20000, effective_at: "2026-09-01T12:11:00Z"}
  - {command_id: command-3, type: place_bid, bid_id: bid-x-2, bidder_id: bidder-x, maximum_minor_units: 30000, effective_at: "2026-09-01T12:12:00Z"}
