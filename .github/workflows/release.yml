name: Publish Ruby gem

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release tag and package
    if: github.repository == 'willtmc/rbbb'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: ruby/engine
      - name: Verify tag, ancestry, changelog, documents, engine, and package
        shell: bash
        run: |
          set -euo pipefail
          version="$(ruby -Iruby/engine/lib -rrbbb/version -e 'print RBBB::VERSION')"
          test "$GITHUB_REF_NAME" = "v$version"
          git rev-parse --verify refs/remotes/origin/main >/dev/null
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          grep -Fq "$version" CHANGELOG.md
          ruby scripts/validate_documents.rb
          (
            cd ruby/engine
            bundle exec rake
            bundle exec rake build
          )
          test -f "ruby/engine/pkg/rbbb-${version}.gem"
      - name: Upload verified gem artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rbbb-verified-gem
          path: ruby/engine/pkg/rbbb-*.gem
          if-no-files-found: error

  publish-rubygems:
    name: Publish to RubyGems.org
    needs: verify
    if: github.repository == 'willtmc/rbbb'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: ruby/engine
      - name: Publish with RubyGems trusted publishing
        uses: rubygems/release-gem@5c53f5308233b7c0f47411f0471b3faae6fa57b2 # v1.4.2
        with:
          working-directory: ruby/engine
      - name: Upload published gem artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rbbb-published-gem
          path: ruby/engine/pkg/rbbb-*.gem
          if-no-files-found: error

  github-release:
    name: Publish matching GitHub release
    needs: publish-rubygems
    if: github.repository == 'willtmc/rbbb'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: "3.4"
      - name: Download published gem artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rbbb-published-gem
          path: ruby/engine/pkg
      - name: Publish matching GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          release_status="$(ruby -Iruby/engine/lib -rrbbb/version -e 'print RBBB::RELEASE_STATUS')"
          gem_file="ruby/engine/pkg/rbbb-${version}.gem"
          test -f "$gem_file"
          checksum="$(sha256sum "$gem_file" | cut -d ' ' -f 1)"
          notes_file="$RUNNER_TEMP/rbbb-release-notes.md"
          release_flags=()
          if [[ "$release_status" != "stable" ]]; then
            release_flags+=(--prerelease)
          fi
          {
            echo "${release_status^} package for the RBBB Ruby reference engine."
            if [[ "$release_status" != "stable" ]]; then
              echo
              echo "Not production ready; do not use it to accept or resolve live bids."
            fi
            echo
            echo "SHA-256: \`$checksum\`"
            echo
            echo "Install with: \`gem install rbbb --version $version\`"
          } > "$notes_file"
          gh release create "$GITHUB_REF_NAME" "$gem_file" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            "${release_flags[@]}" \
            --title "RBBB ${version} — ${release_status} build" \
            --notes-file "$notes_file"
