name: Publish Ruby gem

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish to RubyGems.org
    if: github.repository == 'willtmc/rbbb'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # pinned 2026-09-01
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: ruby/engine
      - name: Verify tag, documents, engine, and package
        shell: bash
        working-directory: ruby/engine
        run: |
          version="$(ruby -Ilib -rrbbb/version -e 'print RBBB::VERSION')"
          test "$GITHUB_REF_NAME" = "v$version"
          ruby ../../scripts/validate_documents.rb
          bundle exec rake
      - name: Publish with RubyGems trusted publishing
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
        with:
          working-directory: ruby/engine
      - name: Publish matching GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          release_status="$(ruby -Iruby/engine/lib -rrbbb/version -e 'print RBBB::RELEASE_STATUS')"
          gem_file="ruby/engine/pkg/rbbb-${version}.gem"
          checksum="$(sha256sum "$gem_file" | cut -d ' ' -f 1)"
          notes_file="$RUNNER_TEMP/rbbb-release-notes.md"
          release_flags=()
          if [[ "$release_status" != "stable" ]]; then
            release_flags+=(--prerelease)
          fi
          {
            echo "${release_status^} package for the RBBB Ruby reference engine."
            echo
            echo "Not production ready; do not use it to accept or resolve live bids."
            echo
            echo "SHA-256: \`$checksum\`"
            echo
            echo "Install with: \`gem install rbbb --version $version\`"
          } > "$notes_file"
          gh release create "$GITHUB_REF_NAME" "$gem_file" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            "${release_flags[@]}" \
            --title "RBBB ${version} — ${release_status} build" \
            --notes-file "$notes_file"
